schema:
  schema_id: flower_pinyin
  name: Flower Pinyin
  version: "0.1"
  author:
    - Flower contributors
  description: Offline Simplified Chinese Pinyin input.

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " '"

translator:
  dictionary: pinyin_simp
  enable_user_dict: true
  enable_sentence: true

menu:
  page_size: 9

key_binder:
  import_preset: default
