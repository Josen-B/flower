name: Windows x64 package

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs
          targets: x86_64-pc-windows-msvc

      - name: Rust format
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Rust tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Strict Clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Python packaging and installer boundary tests
        shell: pwsh
        run: python -m unittest -v scripts/test_package.py scripts/test_installer.py

      - name: Build ZIP package
        shell: pwsh
        run: python scripts/package.py

      - name: Verify package and run executable help
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem -LiteralPath "dist" -Filter "*.zip" -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one ZIP package, found $($archives.Count)."
          }
          $archive = $archives[0]
          $checksumFile = "$($archive.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumFile -PathType Leaf)) {
            throw "Missing external checksum file: $checksumFile"
          }
          $expected = ((Get-Content -LiteralPath $checksumFile -Raw) -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ZIP SHA-256 mismatch."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "flower-package"
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractRoot
          $topLevels = @(Get-ChildItem -LiteralPath $extractRoot -Force)
          if ($topLevels.Count -ne 1 -or -not $topLevels[0].PSIsContainer) {
            throw "ZIP must contain exactly one top-level directory."
          }
          $packageRoot = $topLevels[0].FullName
          & "./scripts/verify_windows_icons.ps1" -BinaryRoot $packageRoot
          Push-Location -LiteralPath $packageRoot
          try {
            $checksumLines = Get-Content -LiteralPath "SHA256SUMS"
            foreach ($line in $checksumLines) {
              if ($line -notmatch "^([0-9a-fA-F]{64})  (.+)$") {
                throw "Malformed SHA256SUMS line: $line"
              }
              $wanted = $Matches[1].ToLowerInvariant()
              $relative = $Matches[2]
              if ([System.IO.Path]::IsPathRooted($relative) -or $relative -match "(^|[\\/])\.\.([\\/]|$)") {
                throw "Unsafe path in SHA256SUMS: $relative"
              }
              $path = Join-Path $packageRoot $relative
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Missing package payload: $relative"
              }
              $found = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($found -ne $wanted) {
                throw "Package payload SHA-256 mismatch: $relative"
              }
            }

            & ".\flower-register.exe" --help
            if ($LASTEXITCODE -ne 0) {
              throw "flower-register.exe --help failed."
            }
            & ".\flower-settings.exe" --help
            if ($LASTEXITCODE -ne 0) {
              throw "flower-settings.exe --help failed."
            }
          } finally {
            Pop-Location
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: flower-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
